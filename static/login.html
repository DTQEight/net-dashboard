<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 网络仪表盘</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2128; --border:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --err:#f85149; --ok:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;
  }
  .box{width:100%; max-width:352px}
  .brand{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin-bottom:22px; font-size:19px; font-weight:600;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:24px 22px;
  }
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  input{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; color:var(--fg); font-size:14px;
    outline:none; transition:border-color .15s;
    font-family:inherit;
  }
  input:focus{border-color:var(--acc)}
  .field+.field{margin-top:14px}
  button{
    width:100%; margin-top:20px; padding:11px; border-radius:8px; cursor:pointer;
    background:var(--acc); color:#08131f; border:none; font-size:14px; font-weight:700;
    font-family:inherit; transition:opacity .15s;
  }
  button:hover:not(:disabled){opacity:.88}
  button:disabled{opacity:.55;cursor:default}
  .msg{
    margin-top:14px; font-size:12.5px; padding:9px 11px; border-radius:7px;
    display:none; line-height:1.5;
  }
  .msg.err{display:block;background:rgba(248,81,73,.10);color:var(--err);border:1px solid rgba(248,81,73,.28)}
  .msg.ok{display:block;background:rgba(63,185,80,.10);color:var(--ok);border:1px solid rgba(63,185,80,.28)}
  .note{margin-top:16px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.6}
  .note code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="dot"></span>网络仪表盘</div>

  <div class="card">
    <form id="f" autocomplete="on">
      <div class="field">
        <label for="u">用户名</label>
        <input id="u" name="username" type="text" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      </div>
      <div class="field">
        <label for="p">密码</label>
        <input id="p" name="password" type="password" autocomplete="current-password">
      </div>
      <button id="btn" type="submit">登 录</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="note">
    登录状态默认保持 7 天<br>
    连续 5 次密码错误会锁定 5 分钟
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const f = $('f'), u = $('u'), p = $('p'), btn = $('btn'), msg = $('msg');

function show(text, kind){
  msg.textContent = text;
  msg.className = 'msg ' + (kind || 'err');
}

// 已经登录了就直接进面板
fetch('/api/whoami', {cache:'no-store'})
  .then(r => r.json())
  .then(d => { if(d && d.loggedIn) location.replace('/'); })
  .catch(()=>{});

f.onsubmit = async (e) => {
  e.preventDefault();
  if(!u.value || !p.value){ show('请填写用户名和密码'); return; }

  btn.disabled = true;
  btn.textContent = '登录中…';
  msg.className = 'msg';

  try{
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({user: u.value, pass: p.value})
    });
    const d = await r.json();

    if(d && d.ok){
      show('登录成功，正在进入…', 'ok');
      location.replace('/');
      return;
    }
    show((d && d.error) || '登录失败');
    p.value = '';
    p.focus();
  }catch(err){
    show('请求失败：' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '登 录';
};
</script>
</body>
</html>
